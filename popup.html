<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>YouTube Video QA</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="logo">▶</div>
      <div>
        <h1>YouTube Video QA</h1>
        <p>Ask anything about the current video</p>
      </div>
    </div>

    <div class="video-card">
      <div class="video-title">Current Video</div>
      <div id="videoStatus" class="video-status">Not loaded yet</div>
      <button id="indexBtn" class="primary-btn">Load Current Video</button>
    </div>

    <div id="chatBox" class="chat-box">
      <div class="bot-message">
        Hi! Load a YouTube video and ask me anything from its transcript.
      </div>
    </div>

    <div class="quick-actions">
      <button id="summaryBtn" class="secondary-btn">Quick Summary</button>
      <button id="clearBtn" class="secondary-btn">Clear Chat</button>
    </div>

    <div class="input-area">
      <textarea id="question" placeholder="Ask a question about this video..."></textarea>
      <button id="askBtn" class="ask-btn">Ask</button>
    </div>

    <div id="status" class="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
